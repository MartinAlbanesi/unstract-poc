# docker-compose.override.yaml — Unstract POC on Windows.
#
# Remaps 4 host ports that collide with services already running on this machine
# (dev servers of another project on 3000/8000/8085, local PostgreSQL on 5432).
# bootstrap.ps1 copies this file into the upstream clone (docker/docker-compose.override.yaml)
# so `docker compose` applies it automatically on top of docker-compose.yaml.
#
# NOTE: `!override` is required. Compose v2 APPENDS `ports` entries from an
# override file instead of replacing them, so without the tag the base ports
# (e.g. 8085) remain published alongside the remapped ones.

services:
  frontend:
    ports: !override
      - "3100:80"

  backend:
    ports: !override
      - "8100:8000"

  db:
    ports: !override
      - "5433:5432"

  worker-api-deployment-v2:
    ports: !override
      - "8185:8090"

  unstructured-io:
    image: quay.io/unstructured-io/unstructured-api:latest
    container_name: unstract-unstructured-io
    networks:
      - default
